[package]
name = "jack"
version = "0.1.0"
edition = "2024"
description = "A self-hosted, token-efficient coding-agent harness and orchestrator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/singhashu23/jack-harness"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jack-engines = { version = "0.1.0", path = "../jack-engines" }
jack-lsp = { version = "0.1.0", path = "../jack-lsp" }
jack-read = { version = "0.1.0", path = "../jack-read" }
jack-store = { version = "0.1.0", path = "../jack-store" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
