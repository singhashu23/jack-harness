[package]
name = "jack-read"
version = "0.1.0"
edition = "2024"
description = "tree-sitter outlines, symbol lookup and output shaping for jack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/singhashu23/jack-harness"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.1"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
