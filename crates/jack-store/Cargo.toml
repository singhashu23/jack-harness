[package]
name = "jack-store"
version = "0.1.0"
edition = "2024"
description = "Per-session SQLite store for the jack agent harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/singhashu23/jack-harness"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
